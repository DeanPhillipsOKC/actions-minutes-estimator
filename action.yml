name: Actions minutes estimator
description: Estimate this month's GitHub Actions minutes from the run list and report a guard level (full, half, stop).
author: Dean Phillips
branding: { icon: clock, color: blue }
inputs:
  monthly-minutes: { description: 'Included minutes per month', default: '3000' }
  repository: { description: 'owner/name to measure', default: '${{ github.repository }}' }
  token: { description: 'Token that can read the repo run list (actions: read)', default: '${{ github.token }}' }
  cache: { description: 'Keep finished days in actions/cache so later runs read only yesterday and today', default: 'true' }
outputs:
  used: { description: 'Estimated minutes used this month', value: '${{ steps.run.outputs.used }}' }
  pace: { description: 'Minutes an even pace allows by today', value: '${{ steps.run.outputs.pace }}' }
  level: { description: 'full, half, or stop', value: '${{ steps.run.outputs.level }}' }
  reason: { description: 'One-line explanation of the level', value: '${{ steps.run.outputs.reason }}' }
runs:
  using: composite
  steps:
    - if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/minutes-ledger.json
        key: actions-minutes-ledger-${{ inputs.repository }}-${{ github.run_id }}
        restore-keys: actions-minutes-ledger-${{ inputs.repository }}-
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        LEDGER: ${{ inputs.cache == 'true' && format('{0}/minutes-ledger.json', runner.temp) || '' }}
      run: |
        out=$(node "${{ github.action_path }}/bin/cli.mjs" --repo "${{ inputs.repository }}" --monthly "${{ inputs.monthly-minutes }}" ${LEDGER:+--ledger "$LEDGER"})
        echo "$out"
        for k in used pace level reason; do
          echo "$k=$(node -e 'console.log(JSON.parse(process.argv[1])[process.argv[2]])' "$out" "$k")" >> "$GITHUB_OUTPUT"
        done
